name: CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build, test, and package
        timeout-minutes: 10
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ./gradlew clean check release
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            ./gradlew.bat clean check release
          else
            ./gradlew clean check release
          fi

      - name: Smoke-test packaged application
        timeout-minutes: 2
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a java -jar release/FindersKeepers.jar --smoke-test
          else
            java -jar release/FindersKeepers.jar --smoke-test
          fi

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindersKeepers-${{ runner.os }}
          path: release/FindersKeepers.jar
          if-no-files-found: error
          retention-days: 7

  build-site:
    name: Build product website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy-site:
    name: Deploy product website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: FindersKeepers-Linux
          path: release-assets

      - name: Create checksum
        run: sha256sum release-assets/FindersKeepers.jar > release-assets/FindersKeepers.jar.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-assets/FindersKeepers.jar \
              release-assets/FindersKeepers.jar.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/FindersKeepers.jar \
              release-assets/FindersKeepers.jar.sha256 \
              --verify-tag \
              --generate-notes \
              --title "Finders Keepers $GITHUB_REF_NAME"
          fi
