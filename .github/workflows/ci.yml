name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build, check, and package release
        timeout-minutes: 10
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./gradlew.bat clean check release
          else
            ./gradlew clean check release
          fi

      - name: Smoke-test release artifact
        timeout-minutes: 2
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a java -jar release/FindersKeepers.jar --smoke-test
          else
            java -jar release/FindersKeepers.jar --smoke-test
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindersKeepers-${{ runner.os }}
          path: release/FindersKeepers.jar
          if-no-files-found: error
